<!DOCTYPE html>


<html lang="zh-CN">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>WUXING · 五行人格</title>


<style>


:root{--bg:#fff;--card:#fff;--text:#1a1a1a;--sub:#999;--border:#eae7e3;--O:#5fa85f;--B:#d4755a;--A:#b6977a;--R:#d4a528;--D:#5f9db5;--acc:#c49a6c}


*{margin:0;padding:0;box-sizing:border-box}


body{font-family:-apple-system,'Helvetica Neue','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.7}


#splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center}


#splash .dots{display:flex;gap:16px;margin-bottom:32px}


#splash .dots span{width:44px;height:44px;border-radius:50%}


#splash h1{font-size:48px;font-weight:200;letter-spacing:20px;color:#222;margin-bottom:14px}


#splash .sub{font-size:18px;color:var(--sub);max-width:360px;letter-spacing:1px}


#splash .btn{margin-top:44px;padding:16px 60px;border:none;background:var(--acc);color:#fff;font-size:17px;border-radius:12px;cursor:pointer;letter-spacing:4px;font-family:inherit}


#splash .btn:hover{opacity:.88;transform:translateY(-2px)}


#splash .foot{color:var(--sub);font-size:13px;margin-top:22px}


#app{display:none;max-width:680px;margin:0 auto;padding:32px 20px 60px}


.topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px}


.topbar .dots{display:flex;gap:6px}.topbar .dots span{width:12px;height:12px;border-radius:50%}


.topbar .tt{font-size:15px;letter-spacing:4px;flex:1;color:#333}


.topbar .st{font-size:13px;color:var(--sub)}


.prog{height:4px;background:#f0eee9;border-radius:4px;overflow:hidden;margin-bottom:32px}


.prog div{height:100%;background:var(--acc);width:0%;transition:width .4s;border-radius:4px}


.qg .item{margin-bottom:28px;padding:24px;border-radius:12px;border:1px solid var(--border)}


.qg .item .qt{font-size:17px;line-height:1.7;margin-bottom:18px;font-weight:400}


.qg .item .ql{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:10px}


.qg .item .qr{display:flex;gap:6px;justify-content:center}


.qg .item .qr button{width:38px;height:38px;border-radius:50%;border:1px solid #ddd;background:var(--card);cursor:pointer;position:relative}


.qg .item .qr button:hover{border-color:var(--acc);background:#faf8f5}


.qg .item .qr button.s{border-width:2px;transform:scale(1.08)}


.qg .item .qr button .in{width:12px;height:12px;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}


.qg .item .qr button.s .in{width:16px;height:16px}


.qg .item .qr button.s.el-O{border-color:var(--O)}.qg .item .qr button.s.el-O .in{background:var(--O)}


.qg .item .qr button.s.el-B{border-color:var(--B)}.qg .item .qr button.s.el-B .in{background:var(--B)}


.qg .item .qr button.s.el-A{border-color:var(--A)}.qg .item .qr button.s.el-A .in{background:var(--A)}


.qg .item .qr button.s.el-R{border-color:var(--R)}.qg .item .qr button.s.el-R .in{background:var(--R)}


.qg .item .qr button.s.el-D{border-color:var(--D)}.qg .item .qr button.s.el-D .in{background:var(--D)}


.nav{display:flex;justify-content:space-between;margin-top:28px}


.nav button{padding:12px 32px;border:1px solid #ddd;border-radius:10px;background:var(--card);cursor:pointer;font-size:14px;font-family:inherit;color:var(--text)}


.nav button:hover{border-color:var(--acc)}.nav button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}


.nav button:disabled{opacity:.3;cursor:default}


/* ── 结果 ── */


.result-wrap{max-width:800px;margin:0 auto;padding:0 24px 80px}


.res-header{background:linear-gradient(135deg,#b6977a,#c49a6c);color:#fff;text-align:center;padding:48px 24px 36px;margin:0 -24px}


.res-header .code{font-size:56px;font-weight:200;letter-spacing:12px;color:#fff}


.res-header .sub{font-size:16px;color:rgba(255,255,255,.85);margin-top:8px;letter-spacing:3px}


.res-header .state{font-size:13px;color:rgba(255,255,255,.7);margin-top:4px;letter-spacing:2px}


.type-O .res-quote{color:var(--O)!important}.type-B .res-quote{color:var(--B)!important}.type-A .res-quote{color:var(--A)!important}.type-R .res-quote{color:var(--R)!important}.type-D .res-quote{color:var(--D)!important}


.res-quote{text-align:center;padding:36px 24px;font-size:24px;line-height:1.9;color:#666;font-style:italic;border-bottom:1px solid var(--border);margin-bottom:28px;font-weight:500}


/* ── 卡片区块 ── */


.res-section{border-left:5px solid var(--accent);margin-bottom:28px;background:#faf9f7;border-radius:0 8px 8px 0;padding:18px 20px 20px 24px}


.res-section:first-of-type{background:#fff}.res-section:nth-child(odd){background:#fff}


.res-section h2{font-size:17px;font-weight:600;color:#222;letter-spacing:2px;padding-bottom:10px;margin-bottom:14px;border-bottom:2px solid #f0eee9;display:flex;align-items:center;gap:10px}


.res-section h2 .h2-icon{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex-shrink:0;font-weight:700}


.res-section p{font-size:16px;line-height:2;color:#444;white-space:pre-wrap}


/* ── 能量分布 ── */


.rsl{display:flex;flex-direction:column;gap:14px;padding:8px 0}


.rsl .rw{display:flex;align-items:center;gap:14px}


.rsl .rw .lb{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;flex-shrink:0}


.rsl .rw .tr{flex:1;height:12px;background:#f0eee9;border-radius:8px;overflow:hidden}


.rsl .rw .tr .fl{height:100%;border-radius:8px;transition:width .8s}


.rsl .rw .pv{width:36px;text-align:right;font-size:14px;color:#999;flex-shrink:0;font-weight:500}


/* 15维 */


.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}


.dgrid .dc{border-radius:8px;padding:12px 14px}


.dgrid .dc .dlb{font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}


.dgrid .dc .dlb .dn{font-weight:600;font-size:13px}.dgrid .dc .dlb span{color:#999;font-size:11px}


.dgrid .dc .dtr{height:5px;background:rgba(0,0,0,.08);border-radius:3px;overflow:hidden}


.dgrid .dc .dtr .df{height:100%;border-radius:3px;transition:width .8s}


/* 名人 */


.fg{display:flex;gap:10px;flex-wrap:wrap}


.fg .fc{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:10px;border:1px solid var(--border);font-size:14px}


.fg .fc .fa{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}


.fg .fc .fn{line-height:1.4;font-weight:500}.fg .fc .fn .ft{font-size:11px;color:var(--sub);font-weight:400}


.rb{display:block;margin:40px auto;padding:14px 40px;border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;cursor:pointer;font-size:14px;letter-spacing:3px;font-family:inherit}


.rb:hover{background:var(--accent);color:#fff}


/* 转化路径 */


.transform-box{border:1px solid var(--border);border-radius:12px;overflow:hidden}


.tb-row{display:flex;padding:14px 18px;gap:14px;align-items:flex-start}


.tb-row+.tb-row{border-top:1px solid var(--border)}


.tb-tag{flex-shrink:0;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;color:#fff;letter-spacing:1px;min-width:48px;text-align:center}


.tb-tag.ok{background:var(--O)}


.tb-tag.ko{background:var(--A)}


.tb-tag.go{background:var(--B)}


.tb-body{flex:1;font-size:15px;line-height:1.7;color:#444}


/* 类型主题色 */


.type-O{--accent:#5fa85f}.type-O .res-header{background:linear-gradient(135deg,#5fa85f,#4a8a4a)}


.type-B{--accent:#d4755a}.type-B .res-header{background:linear-gradient(135deg,#d4755a,#c06045)}


.type-A{--accent:#b6977a}.type-A .res-header{background:linear-gradient(135deg,#b6977a,#a08060)}


.type-R{--accent:#d4a528}.type-R .res-header{background:linear-gradient(135deg,#d4a528,#b08820)}


.type-D{--accent:#5f9db5}.type-D .res-header{background:linear-gradient(135deg,#5f9db5,#4080a0)}


.type-O .res-header{background:linear-gradient(135deg,#5fa85f,#4a8a4a)}


.type-B .res-header{background:linear-gradient(135deg,#d4755a,#c06045)}


.type-A .res-header{background:linear-gradient(135deg,#b6977a,#a08060)}


.type-R .res-header{background:linear-gradient(135deg,#d4a528,#b08820)}


.type-D .res-header{background:linear-gradient(135deg,#5f9db5,#4080a0)}





.transform-box{border:1px solid var(--border);border-radius:12px;overflow:hidden}


.tb-row{display:flex;padding:16px 20px;gap:16px;align-items:flex-start}


.tb-row+.tb-row{border-top:1px solid var(--border)}


.tb-tag{flex-shrink:0;padding:4px 12px;border-radius:6px;font-size:13px;font-weight:600;color:#fff;letter-spacing:1px;min-width:52px;text-align:center}


.tb-tag.ok{background:var(--O)}


.tb-tag.ko{background:#c49a6c}


.tb-tag.go{background:var(--B)}


.tb-body{flex:1;font-size:15px;line-height:1.7;color:#444}


.tb-body strong{color:#222}


@media(max-width:480px){.result-wrap{padding:0 14px 60px}.res-header{padding:36px 16px 28px;margin:0 -14px}.res-header .code{font-size:40px}.res-quote{font-size:17px;padding:24px 16px}}


</style>


</head>

function energyDesc(pr,sc){var ch=GEN[pr],co=CON[pr];var combo_tips={O_B:'你有很多想法（木），并且行动力（火）够强能把它们做出来。但小心跑得太快——需要给自己加一点结构（金）来筛选优先级。',O_A:'你有创造力（木）也有稳定性（土），但土克木——你可能会因为求稳而不敢冒险。想想上次因为再想想而错过的机会。',O_R:'你的想法（木）正在被结构（金）制约。但有些事没有按理说也能做成。',O_D:'深度（水）滋养你的创造力（木）。你是一个能从内在源源不断汲取灵感的人。问题是：输出够不够多？',B_O:'你行动快（火），想法也很多（木）。这个组合能量充沛，但容易散——需要聚焦。',B_A:'你的行动力（火）在为你打地基（土）。最聪明的勤奋不是一直冲，是知道什么时候该停下来。',B_R:'你干得快（火），但规则（金）偶尔拖住你。不是每件事都需要先搞清楚再做。',B_D:'你的激情（火）被深度（水）克制。这其实是一种天赋——你不是冲动的人，你有节奏感。',A_O:'你很稳（土），但想法太多（木）让你不太安分。这不是坏事——你正在生长的信号。',A_B:'你的稳定（土）来自过去的行动（火）。你在为未来的爆发积蓄能量。',A_R:'稳定（土）催生结构（金）。你不再满足于还行，开始追求更好的系统。',A_D:'你稳（土）也深（水），但土克水——太稳了反而限制了自己的深度。下水试试水温。',R_O:'你的结构（金）在约束你的创造力（木）。偶尔不按计划来，天不会塌。',R_B:'逻辑（金）和行动（火）在你的体内交战。最好的状态是：用逻辑规划，用行动执行。',R_A:'你正在把规则（金）变成习惯（土）。这是从知道到成为的过程。',R_D:'结构（金）通向深度（水）。你不满足于表面答案，想搞清楚背后的为什么。',D_O:'你的深度（水）在滋养创造力（木）。突然冒出的灵感不是走神——是你想得够深了。',D_B:'你的沉静（水）在平衡冲动（火）。这是你最大的内在智慧。',D_A:'你深（水）也稳（土），但土克水——太稳了会让你的深度找不到出口。需要一点行动（火）来推动。',D_R:'深度（水）与结构（金）在一起。你既有深度又有条理，这是很强的组合，但小心过度分析。'};

function sysPos(pr,sc){var combo={O_B:'你的创造力正在点燃行动。你不是纸上谈兵的人。',O_A:'你的创意正在寻找土壤。先种下一颗，别急着播种整个花园。',O_R:'你的灵感需要容器来承载。一个好的框架比一百个想法更有价值。',O_D:'你在深度中汲取养分。独处不是逃避，是充电。',B_O:'你的行动力正在被想法滋养。你是一个有方向的推动者。',B_A:'你的热情正在为你建立安全感。打好地基再往上盖。',B_R:'你的行动力正在寻找节奏。纪律不是束缚，是让你跑得更远的跑道。',B_D:'你的冲动正在被沉淀。最好的行动不是最快的行动。',A_O:'你的稳定感在接纳新的可能性。不是所有的变动都值得恐慌。',A_B:'你的根基已经稳固。下一步是生长。',A_R:'你从稳定走向结构。好系统能让你事半功倍。',A_D:'你的稳重正在往深处扎根。别怕深，那是你独有的优势。',R_O:'你的框架在容纳创造力。最好的结构是有弹性的。',R_B:'你的规划正在被行动激活。完美的计划不如一次执行。',R_A:'你的规则在变成习惯。这是最高级的自律。',R_D:'你的逻辑正在导向本质。你不只是聪明，你是通透。',D_O:'你的深度正在变成灵感。所有的思考都不会白费。',D_B:'你的沉静中藏着力量。不是无动于衷，是在等待最好的时机。',D_A:'你的深度需要和世界连接。走出来的想法才是活的。',D_R:'你的深思正在形成体系。你在构建自己的思想大厦。'};return combo[pr+'_'+sc]||E[pr].cn+E[sc].cn+'的组合让你独一无二，继续探索吧。';}


function shengke(pr,p){var ch=GEN[pr],co=CON[pr];return '┃ 生：'+E[pr].cn+'('+p[pr]+'%) → '+E[ch].cn+'('+p[ch]+'%) → '+E[GEN[ch]].cn+'\n┃ 克：'+E[pr].cn+'('+p[pr]+'%) ✕ '+E[co].cn+'('+p[co]+'%)';}


function transformBox(pr,p){var ch=GEN[pr],co=CON[pr];var lines=[];lines.push({t:'ok',txt:'生→ 你擅长滋养 '+E[ch].cn+'（'+E[ch].cn+'：'+p[ch]+'%）。当你主动输出 '+E[pr].cn+' 能量时，你的 '+E[ch].cn+' 会被自然带动。'});lines.push({t:'ko',txt:'克← 你的盲区是 '+E[co].cn+'（'+p[co]+'%）。'+E[pr].cn+' 会克制 '+E[co].cn+'，试着让它为你所用而不是对抗它。'});lines.push({t:'go',txt:'合↑ 当你有意识地在 '+E[GEN[ch]].cn+'（对应 '+E[GEN[ch]].cn+' 领域）实践时，系统会进入正向循环。'});var h='';for(var i=0;i<lines.length;i++){h+='<div class="tb-row"><div class="tb-tag '+lines[i].t+'">'+{ok:'生',ko:'克',go:'合'}[lines[i].t]+'</div><div class="tb-body">'+lines[i].txt+'</div></div>';}return h;}


function pickFam(arr,start,n,seen,picked){for(var c=0;c<3;c++){var fi=(start+c)%arr.length;if(!seen[fi]&&picked.length<n){seen[fi]=1;picked.push(arr[fi]);}}}








var suffixDesc={'A_A':'你的稳定性强到可能被忽略。你太擅长适应和承受，以至于身边的人忘记了你也有自己的需求和边界。\n• 学会表达「我不想」和「我不行」\n• 定期给自己一个彻底放松的机会\n• 你值得被关注，不只是被依赖','A_C':'你在稳定与深刻的拉扯中寻找平衡。你既想要安定的生活，又渴望深层的意义。这种张力不是缺陷，是你独特的动力源。\n• 在稳定的基础上留出探索空间\n• 你的深层需求值得被认真对待\n• 别用忙碌来逃避内心真正的声音','A_H':'你像一片沃土，稳定可靠，让人安心。你的核心优势是给予他人安全感和归属感，在任何团体中你都是那个让人放心的人。\n• 你的稳定是你的超能力，但别让舒适区变成牢笼\n• 偶尔主动打破常规，会发现新的可能性\n• 你的包容力很强，记得也要保护好自己','A_T':'你正在从守护者变成建设者。过去的你擅长维持和守住，现在你开始主动塑造和创造。这是人生的重要转折点。\n• 接受转型期的混乱是正常的\n• 建立新的框架来承接你的变化\n• 你不再只是围墙，你是建筑本身','B_A':'你的火焰太旺了。你总是在冲刺，停不下来。能量是你的标志，但过度燃烧会让你失去方向。\n• 学会给自己设定「休息日」\n• 不是每个想法都需要立即行动\n• 真正的力量也包括暂停的能力','B_C':'你的火遇到了规则的墙。你觉得束缚，觉得被限制。但这种对抗本身就在帮你找到更好的燃烧方式。\n• 规则不是敌人，是壁炉的壁\n• 学会在约束中找到创造性表达\n• 你的反叛能量值得被尊重和引导','B_H':'你是一团温暖而稳定的火。你的热情有方向，你的行动有节奏。你懂得如何既保持活力又不耗竭自己。\n• 你的感染力是你的天赋\n• 保持这种平衡，别让热情变成冲动\n• 你是那些需要勇气的人最好的伙伴','B_T':'你正在从冲动走向策略。你开始发现：冲得最快的不一定走得最远。你正在学习如何用脑掌舵用心点火。\n• 暂停不是放弃，是瞄准\n• 把你的热情变成持久的力量\n• 真正的行动力是有方向的','D_A':'你沉得太深了。思考是你的安全区，但也可能是你的牢笼。你习惯在行动前想清楚一切，但有些答案只能在行动中找到。\n• 完美理解不如一次尝试\n• 设定「思考截止时间」——然后就行动\n• 你有足够的判断力，相信它','D_C':'你的内心世界与外在表现在打架。你内心丰富但很少表达出来。不是内向的问题，是你还没找到属于自己的表达方式。\n• 找到一种让你舒服的表达媒介\n• 哪怕只说出一分，世界也会不同\n• 你的沉默是力量也是隔阂','D_H':'你是一口深井，拥有别人难以企及的内心世界。你的洞察力和思考深度是你的核心天赋。向内看是你的力量。\n• 你的深度是礼物，不是问题\n• 偶尔把井水打上来，让世界尝尝\n• 你需要找到表达内心世界的出口','D_T':'你正在从旁观者变成参与者。过去你花了很多时间观察和理解世界，现在是时候下场了。你有足够的储备。\n• 行动是最好的思考伴侣\n• 不需要等到完美再开始\n• 你的深度思考现在有了用武之地','O_A':'你的生命力太旺盛了。所有的方向都在吸引你，所有的可能性都想尝试。生长过剩会让你失去焦点。\n• 给每个想法一个「72小时窗口」\n• 不是所有的生长都是好的生长\n• 方向比速度重要','O_C':'你的生长和你的结构在打架。你既渴望自由的创造又需要秩序的支持。这种内耗是痛苦，也是创造力之源。\n• 用结构来服务于创造力，而不是压抑它\n• 接受这种张力是你的一部分\n• 你在经历从天才到匠人的蜕变','O_H':'你像一棵自由生长的树。好奇心是你的养分，适应力是你的根系。你总能找到适合自己的生长方式。\n• 保持好奇心是最好的保鲜剂\n• 你的弹性是你的核心竞争力\n• 在变化中找到自己的节奏','O_T':'你正在从想象者变成实现者。过去你擅长做梦，现在你开始学习把梦变成现实。这是质变的过程。\n• 结构不是创意的敌人\n• 每一步脚踏实地的执行都在让你更加强大\n• 你正在成为那个能连接灵感与现实的人','R_A':'你太相信逻辑了。你对秩序和准确性的追求有时会让你错失那些无法被分析的美好。世界不全是方程式。\n• 给直觉和感性留出空间\n• 有些事不需要完美，只需要完成\n• 你的严谨是礼物，但不是唯一的工具','R_C':'你的秩序感和创造力在较劲。你既想把每件事都做到标准，又想做出不一样的东西。杰作往往诞生于这种张力。\n• 别急着消除矛盾，利用它\n• 给自己一个「不完美实验」的时间\n• 规则和创造不是对立面','R_H':'你像一座设计精妙的建筑。你的逻辑感和秩序感是你的天赋。你善于在混乱中找到结构，在复杂中找到规律。\n• 你的系统思维是宝贵的资产\n• 记得留出灵活的空间\n• 最好的结构是那些能包容变化的','R_T':'你正从分析师变成设计师。你不再只是理解世界如何运作，你开始主动构建它。这是从被动到主动的跃迁。\n• 好的设计既需要规则也需要突破\n• 你已经有足够的理解，现在是创造的季节\n• 你的结构感将成为你改变世界的工具'};var transformData={A_D:{ok:'稳定（土）约束深度（水）。如果你太追求安稳和确定性，你会不敢沉下去面对那些没有答案的深问题。',ko:'但如果土太强，你会变得肤浅——生活太舒服了，就不想再去追问那些让人不安的问题。',go:'在你的稳定生活中，主动设定一个「不安时刻」——每周安排时间面对一个你没有答案的大问题。'},A_R:{ok:'稳定（土）会自然催生结构（金）。当你不必为生存和安全感操心时，自然会追求更好的秩序和更高的标准。',ko:'但如果只有土没有金，你的稳定就是停滞——因为没有规则的容器来约束和提升。',go:'在你已经稳定下来的领域，主动建立规则和标准。整理你的知识、优化流程、设定边界。'},B_A:{ok:'行动（火）的热量经过燃烧会留下灰烬——这些灰烬就是你的稳定根基（土）。你过去的每一次行动，都在为你积累安全感。',ko:'但如果只有火没有土，你的行动就像在沙地上奔跑——很努力，但没有留下任何痕迹。',go:'定期回顾你的行动成果，把做过的系统化、文档化、流程化。用火的热量来烘焙土的坚实。'},B_R:{ok:'热情（火）融化僵硬的规则（金）。当你真正投入一件事时，死板的条条框框会被热情冲破——你会发现很多你以为的「必须」其实只是「习惯」。',ko:'但如果火太强金太弱，你会变成一个没有原则的莽夫——热情来得快去得也快，留下的只有烂摊子。',go:'用火的热度去检验哪些规则是真正必要的，哪些只是惯性。保留必要的规则，烧掉多余的。'},D_B:{ok:'深度（水）冷却冲动（火）。你的反思力是你最好的刹车——在你快要失控的时候，深思的习惯把你拉回来。',ko:'但如果水太强火太弱，你会被自己的深思麻痹——永远在冷却中，永远无法燃烧。',go:'给你的冲动预留空间。在深思之前先行动30分钟——你会发现有时候最好的反思是在行动之后而不是之前。'},D_O:{ok:'深度（水）滋养创造力（木）。当你深入思考之后，灵感和创意会像植物吸水后生长一样自然出现。',ko:'但如果只有水没有木，你的深度就会变成死水——再深刻的思想，没有创造性的输出，也只是一个人的冥想。',go:'在每一次深度思考之后，强制输出一个创造性的结果——一个观点、一个作品、一个解决方案。'},O_A:{ok:'生长（木）打破稳定（土）。当你想要成长和改变时，必然会挑战已有的舒适区。这是成长的必经痛苦。',ko:'但如果木太强土太弱，你会一直处于动荡中——永远在追新，永远没有落脚的地方。',go:'在追求生长的同时，保留一块不动的领域作为锚点。不一定要什么都变，有些东西不变反而是你生长的基石。'},O_B:{ok:'想法（木）是你行动的燃料。当你有一个真正兴奋的创意时，行动力（火）会自然被点燃。你不是缺乏行动力，是还没有找到那个让你非做不可的想法。',ko:'但如果只有创意没有行动力，想法就会变成空转的内燃机——热量全在自己体内，没有输出。',go:'给每一个木（创意）配一个火（行动）的出口。创意如果在72小时内没有第一步行动，就要被归档或放弃。'},R_D:{ok:'结构（金）会导向深度（水）。当你把一件事情的结构弄清楚了，下一步自然会追问背后的本质和意义——这就是金生水。',ko:'但如果只有金没有水，你的规则就会干涸——变成没有灵魂的流程，做事的机器。',go:'在建立规则和结构之后，留出反思的空间。问自己：这个规则背后的为什么、我在这个系统中扮演什么。'},R_O:{ok:'规则（金）约束创造力（木）。好的规则像大树的支撑架——让树长得更高而不是被风刮倒。适当的约束能让创造力更有方向。',ko:'但如果金太强木太弱，你的规则会杀死所有灵感——一个只有流程没有创意的系统是没有生命力的。',go:'在规则中留出「灰色地带」。每周设定一个完全不受规则约束的时间窗口，只做没有目的的事。'}};


function growthAdvice(pr,st){


var adv={'A_A':'你的稳定能力极为突出，但容易把自己放在最后一位。过度的适应会让你失去自我。\n• 发展建议：练习主动说不，每天至少拒绝一件小事\n• 成长空间：找回自己的边界感，你不需要让所有人都满意\n• 适合领域：需要极高稳定性的岗位，但要搭配能表达自我的环境','A_C':'你既需要安全感又需要深度，这个组合让你在人群中很特别。你不是优柔寡断，你是两种能量的对话。\n• 发展建议：每周安排独处时间，听听自己内心到底想要什么\n• 成长空间：信任你的判断力——你比你以为的更了解自己\n• 适合领域：需要耐心和深度的职业，如咨询、研究、写作者','A_H':'你最大的优势是稳定和包容。你让周围的人感到踏实，这是这个时代非常稀缺的能力。\n• 发展建议：主动承担需要耐心的角色，比如调解者、支持者\n• 成长空间：学会表达自己的需求，别总是「没问题」\n• 适合领域：教育、管理、心理咨询、需要持续稳定的行业','A_T':'你正在从稳定走向建构。你不再满足于守住已有的，开始想要创造新的。这个转型需要勇气和框架。\n• 发展建议：把你的变化记录下来，建立自己的转型日志\n• 成长空间：接受不确定性——建设者永远在未完成的工地中\n• 适合领域：项目管理、创业、任何需要从0到1的岗位','B_A':'你是行动力爆棚的人。问题在于燃烧太快，容易在长跑中耗尽。你需要学会管理自己的能量而非压抑它。\n• 发展建议：建立「行动-反思」的节奏，不是只有动才算活\n• 成长空间：学会区分紧急和重要——不是所有火都要救\n• 适合领域：创业、市场、公关、应急管理','B_C':'你的热情遇到了规则的阻力。你觉得难受，但这是成长的必经之路。火焰有了边界才能变成有用的能源。\n• 发展建议：把你的反叛能量引导到创造性解决问题上\n• 成长空间：规则是你的导航，不是你的牢笼\n• 适合领域：需要创新又需要纪律的领域，如产品经理、设计师','B_H':'你是一团有方向的火——热情而稳定，行动而有节奏。你懂得如何让能量持久。\n• 发展建议：用你的感染力去带动别人，你是天生的点火者\n• 成长空间：学会在行动前多一秒停顿，这一秒就是智慧\n• 适合领域：销售、演讲、创业、团队领导者','B_T':'你正在从冲动走向策略。你开始理解：行动力需要方向才能发挥最大价值。这是成熟的重要标志。\n• 发展建议：把每个冲动转化为一个具体的小目标\n• 成长空间：耐心是最好的燃料——持续的小火比短暂的大火更有力量\n• 适合领域：战略咨询、项目推动、任何需要从行动中学习的人','D_A':'你想得太多了。你的思考力是强大的，但过度思考会让你停在原地。你需要的不是更多答案，是第一个行动。\n• 发展建议：设置「行动触发器」——想5分钟就下决定\n• 成长空间：接受不完美——世界上没有完美的决策时机\n• 适合领域：需要深度分析的岗位，但要搭配行动导向的团队','D_C':'你的内在世界极其丰富但表达不足。你有很多想说的，但很少说出口。你需要的不是学会外向，而是找到属于自己的表达方式。\n• 发展建议：找一个你喜欢的表达媒介——写作、画画、音乐都行\n• 成长空间：每周至少和别人分享一个你的真实想法\n• 适合领域：创作、研究、心理咨询、数据分析','D_H':'你的深度是你的核心资产。你能看到别人看不见的层面，这让你在任何领域都能走得更深。\n• 发展建议：定期把你的思考写出来，输出是最好的消化\n• 成长空间：适度参加需要快速反应的场景，别让慢热限制你\n• 适合领域：研究、分析、写作、学术、工程架构','D_T':'你正在从观众走向舞台。过去你花了很多时间观察和理解，现在该上场了。你有足够的知识和判断力。\n• 发展建议：把「再想想」换成「先试试」——行动是最好的老师\n• 成长空间：你不需要知道所有答案才能开始\n• 适合领域：从研究转向应用的岗位，如产品经理、技术负责人','O_A':'你的创造力和好奇心过剩了。你被太多可能性吸引，容易迷失在选择中。收敛比发散更需要勇气。\n• 发展建议：每月做一个「放弃清单」——哪些事情你决定不再追了\n• 成长空间：追求深度而不是广度——在某个点上做到极致\n• 适合领域：需要有广度也需要有深度的角色，如产品经理、策略师','O_C':'你的创造冲动和你的结构需求在打架。你在两种力量之间摇摆，这是非常有创造力的状态——关键是如何驾驭它。\n• 发展建议：把结构当作容器而不是牢笼\n• 成长空间：接受你需要两条腿走路——灵感需要落地的通道\n• 适合领域：需要创意与系统并重的岗位，如架构师、策划人','O_H':'你是天生的创新者。好奇心是你的引擎，适应力是你的底盘。你总能在变化中找到机会。\n• 发展建议：给你的每个想法设置实验周期——12周的MVP\n• 成长空间：学会聚焦——最好的创意是执行出来的不是想出来的\n• 适合领域：创意、设计、战略、创业、产品开发','O_T':'你正在从梦想家变成实现者。这是最艰难的转变——从想得到到做得到。每一步艰难的执行都在重塑你。\n• 发展建议：把一个最心动的想法用最小成本实现出来\n• 成长空间：把「完美」的标准从结果转移到过程——完成比完美更重要\n• 适合领域：从概念到落地的角色，如项目负责人、技术创始人','R_A':'你太擅长用逻辑解决问题了。这是你的超能力，也是你的局限。世界有一部分是逻辑之外的，需要你用别的方式去感受。\n• 发展建议：每周做一件完全非理性的事——凭感觉走一次\n• 成长空间：你的理性是工具，不要让工具定义你\n• 适合领域：需要严谨思维的角色，但要搭配能激发感性面的生活','R_C':'你的秩序感和创造力在较劲。这是你最有意思的地方，也是最让你内耗的地方。这种张力正是你与众不同的来源。\n• 发展建议：用你的结构感去服务于创造力，为灵感搭建框架\n• 成长空间：接受矛盾——你不需要选边站，你可以两者都是\n• 适合领域：设计系统架构、制定流程标准、需要用规则解放创造力的工作','R_H':'你是天生的系统思维者。你能在混乱中找到秩序，在复杂中发现规律。这种能力让任何与你合作的都会变得更有序。\n• 发展建议：把你的方法论输出成文档或分享，你的框架能帮很多人\n• 成长空间：给直觉留出空间——最好的决策往往不全是逻辑\n• 适合领域：工程管理、系统设计、战略规划、数据分析','R_T':'你正从分析走向设计。过去你擅长理解和拆解，现在你开始构建和创造。这是从被动到主动的质变。\n• 发展建议：找到一个你感兴趣的系统，尝试重新设计它\n• 成长空间：在结构之外留出即兴的空间——最好的改进来自意想不到的地方\n• 适合领域：系统架构师、产品设计师、组织变革者'};



return adv[pr+'_'+st]||'你是独特的。最好的成长不是变成别人而是把自己变得更好。';


}

var count=Math.min(n||7,copy.length);

}


return res;


}
