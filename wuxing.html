function dimScores(){var r={};for(var k in E){var el=E[k];for(var j=0;j<el.d3.length;j++){var d=el.d3[j];var sc=0,cnt=0;for(var q=0;q<d.q.length;q++){var qid=d.q[q];var ans=ANSW[qid];if(ans!==undefined&&ans!==null){var wt=QQ[qid].w[k]||1;sc+=((Number(ans)+3)/6)*100*wt;cnt+=wt;}}r[k+'_'+j]=cnt>0?Math.round(sc/cnt):50;}}return r;}
var tags={O_H:'你是一颗随时准备发芽的种子。不要把自己种在花盆里。',O_A:'你的生命里同时住着春天和秋天。发芽和凋零交替，都是自然。',O_C:'你的创造力与结构在打架。不是你有问题，是系统在重新找平衡。',O_T:'你正从想象者变成实现者。这个转化需要结构（金）来承接。',B_H:'你是一团不灭的火。但火需要炉子才能变成能量。',B_A:'你的火焰太大了。不是你的错，是燃料太多但缺乏出口。',B_C:'你的冲劲与规则在对抗。火需要边界才能照亮房间，而不是烧掉它。',B_T:'你正在从冲动的行动者变成有策略的推动者。停下来不是退缩，是瞄准。',A_H:'你是一片耕种过的土地。休耕是为了更好地生长。',A_A:'你太稳了。稳得让周围的人忘记了你的存在——包括你自己。',A_C:'你的稳定与你的深度在拉锯。不是矛盾，是大地与深水的对话。',A_T:'你正在从守护者变成建设者。框架会让你更自由。',R_H:'你是一座精心设计的建筑。但建筑需要人在里面生活。',R_A:'你太相信逻辑了。世界有一半的事不是“对”的，是“对的时机”。',R_C:'你的结构冲动与你的创造冲动在较劲。杰作往往诞生于这种张力。',R_T:'你正从分析者变成设计者。好的结构不是限制，是解放。',D_H:'你是一口深井。井水需要被打上来才能解渴。',D_A:'你想得太深了。深到连自己都找不到出口。需要行动（火）来照亮。',D_C:'你的深度与你的对外表现在对抗。内向不是问题，不出声才是。',D_T:'你正从观察者变成参与者。待在岸边看了一辈子，该下水了。'};
var suffixDesc={O_H:'你像一片刚被春雨洗过的森林，每种能量都在恰到好处的位置。生长与收敛交替，生机与沉静共存。\n\n具体表现：你的好奇心不会泛滥成空想，稳定也不会变成死板。做决定时既有直觉也有理性，能快速切换状态。和你相处让人觉得舒服但不模糊。\n\n提醒：和谐是你的天赋，但也可能是陷阱。当你想“都行”的时候，问问自己——是真的都行，还是你不敢选？',O_A:'你是一棵疯长的榕树，枝叶遮天，气根垂地，每一寸都在抢夺阳光和空间。生命力太旺盛了，旺盛到让人透不过气。\n\n具体表现：你的想法像潮水一样涌来，做不完又放不下。和人交谈时你控制不住地输出，忘记了倾听也是交流的一半。你总是同时启动太多项目，导致每个都做不深。\n\n提醒：不是你不够好，是太好了。你需要的是金（结构）——用规则来雕刻你的生长方向，而不是让创意各自为战。',O_C:'你的创造力本能与另一种力量在体内拉锯。像一棵树长在悬崖边，一半在向上伸展，一半被岩石挤压。不是你出问题了，是你的系统在寻找新的平衡。\n\n具体表现：你经常对同一个决定反复摇摆。一会儿觉得这个项目太棒了，一会儿又怀疑自己。做事忽快忽慢，有时候灵感爆棚，有时候卡文到怀疑人生。\n\n提醒：冲突不是病，是成长的痛。关键在于你选择让哪种能量先“说话”——给自己一段不受干扰的时间，让其中一种能量充分表达，另一种自然会找到自己的位置。',O_T:'你的木能量正在经历一场深刻的转变。像一棵树从阔叶转变为针叶——生长的本质没变，但形态和策略完全不同了。旧的可能已经枯萎，新的还没成荫。\n\n具体表现：你开始对那些曾经让你兴奋的事感到厌倦。过去百试百灵的创造方法不再奏效。你有一种“之前的版本不匹配了”的直觉，但新的方向还很模糊。\n\n提醒：转化期最危险的陷阱是回到过去。给自己一个“空窗期”——三个月内不启动任何新项目，只观察自己的能量流到哪里。',B_H:'你是一团温度恰到好处的篝火，既能照亮四周又能给人温暖。你的行动力不盲目，热情不烫人——这是火元素最成熟的状态。\n\n具体表现：你有号召力但不强势，别人愿意跟着你的节奏走。你做事果断但不鲁莽，该冲的时候冲，该等的时候等。朋友觉得和你在一起有安全感也有乐趣，因为你既会点燃气氛也懂得何时收火。\n\n提醒：和谐的火容易被忽略——因为你不制造麻烦，别人也就理所当然地享受你的能量。别忘了给自己充电，火光熄灭之前没有预兆。',B_A:'你是一场森林大火，炽烈、迅猛、不可阻挡。你的存在本身就是力量宣言。但大火过后，土壤会板结，寸草不生。\n\n具体表现：你想做什么就立刻去做，从不拖泥带水。但你说话太直接，有时候把人烧伤了还不自知。你习惯用行动解决问题，但有些问题需要的是“等”而不是“做”。\n\n提醒：你不是能量太大，是你的容器太小。把你的目标放大三倍，你就不需要用烧毁身边人的方式来证明自己了。找一个值得你用一生去燃烧的事业。',B_C:'你的火遇到了克制它的能量——要么被水浇灭，要么被金困住。你的行动力在和你体内另一种力量打架。你不是不热情，是你的热情一直被打断。\n\n具体表现：你正准备行动就会被一个“再想想”的声音拖住。如果是水辅，你总是在冲动后陷入深度反思，导致下次不敢再动。如果是金辅，你每次想行动都会被“流程对不对”束缚。\n\n提醒：冲突型火人最容易在自我质疑中熄灭。定一个简单的规则：小事冲动，大事深思。',B_T:'你正在从一台火焰喷射器变成一座可控核反应堆。能量密度不变，但输出方式从散射变成了聚焦。这是火元素最重要的进化。\n\n具体表现：你发现自己不再热衷于每个社交场合。你开始在冲动前多停顿一秒。你不再为了证明自己而行动，开始问“这件事值不值得”。\n\n提醒：转化不是消沉，是升级。最好的行动不是最快的行动，而是最准的行动。你需要一个信赖的人在旁边帮你校准方向。',A_H:'你是一片辽阔而肥沃的平原，四季分明，风雨不惊。你的稳定不是死板，是包容。你的厚重不是迟钝，是接纳。\n\n具体表现：朋友有事第一个找你倾诉，因为你是那个听了不会乱传不会乱评价的人。你做事有节奏，不急不缓，让人放心。你不追求做最闪亮的那个，但你走后别人能感受到空缺。\n\n提醒：和谐型土人最大的风险是被人遗忘。每月为自己高声说一次“我想要”——哪怕只是在社交平台上发一条动态。',A_A:'你不是土壤，是水泥。稳定到极致变成了固化。你太可靠了，可靠到所有人都忘了你也会有情绪——包括你自己。\n\n具体表现：你极度抗拒变化，哪怕是有益的变化。你宁愿忍受糟糕的现状也不愿面对重组的痛苦。你习惯性地把别人需求放在前面，久而久之已经不知道自己要什么。\n\n提醒：你不是没有欲望，是你压得太深了。土过旺的解药是木——让“想要”长出来。每周做一件只为自己开心的事，不问意义。',A_C:'你的稳定本能和你的另一种能量在较劲。你是大地，但体内还有深水在涌动，或有金属在切割你的表层。你不是分裂，是地壳运动。\n\n具体表现：如果你辅能量是水，你表面平静但内心波涛汹涌——别人以为你没事，其实你在挣扎。如果你辅能量是金，你一方面想要自由，一方面忍不住列清单，两种声音让你精疲力尽。\n\n提醒：冲突不是要你选阵营。大地既可以含水也可以藏金。给它们不同的时间窗口——上午做计划，晚上随心所欲。',A_T:'你正在从一座堡垒变成一座花园。过去你的存在是为了坚固和防御，现在你想要生命中长出些柔软的东西。\n\n具体表现：你开始做一些“没用”的事——养一盆不好养的花，学一门不为了加薪的技能。你发现自己在慢慢放松对周围人的要求。你开始理解“变化中的稳定”才是真正的强大。\n\n提醒：转化期的土最需要的是“允许”——允许自己不确定，允许自己做不好。堡垒转向花园需要打开城门，这意味着短暂的脆弱，但值得。',R_H:'你是一座设计精密的钟表，每个齿轮都在正确的位置运转。你的逻辑和条理让你在任何系统中都如鱼得水。\n\n具体表现：你天生擅长找规律和搭结构。混乱的环境让你不舒服，但你是在本能地把它变有序。你说话不过快，一针见血。别人还在抒发情绪，你已经在列解决方案了。\n\n提醒：和谐型金人最危险的错觉是“想清楚就能做好”。每周做一件没有逻辑根据的事——为了让你的系统保持弹性。',R_A:'你太相信逻辑了。你的思维框架太精密，精密到拒绝一切不符合框架的信息。\n\n具体表现：你有一套看待世界的标准模型，任何不符合模型的事都会被自动过滤。你不理解为什么有人“凭感觉”做决定。你的计划永远完美，但往往只在纸面上完美。\n\n提醒：过旺的金需要的不是更多逻辑，而是火——热情和冲动。试凭直觉做一个不大不小的决定，先感受“不确定”也是一种能力。',R_C:'你的秩序本能与你的另一种能量在对抗。法官和艺术家在你脑海中不停地打架。\n\n具体表现：如果是木辅，你的创造冲动被规则反复压制——你有一个好主意，但紧接着就有一百个“这行不通”的理由。如果是水辅，你在追求深度时被“效率焦虑”打断。\n\n提醒：冲突型金人要学会的不是压制某一方，而是轮流执政。给创造力一个不受批评的时间段，给逻辑一个不受干扰的分析阶段。',R_T:'你正在从一个分析师进化成一个系统架构师。从“看穿事物”升级到“构建事物”。\n\n具体表现：你开始不满足于看懂一个系统，你想设计一个系统。你发现对“为什么不行”的兴趣正在让位于“怎么才能行”。你不再只是批评者，你在变成建造者。\n\n提醒：转化期最大的敌人是完美主义导致的拖延。先搭一个粗糙的框架跑起来。好的系统不是设计出来的，是迭代出来的。',D_H:'你是一口深不见底的井，水质清冽，四季不枯。你的深度不是负累，是资源。\n\n具体表现：你对事情的理解比大多数人深一层。别人看到表象，你看到结构。别人听到观点，你听到假设。你一个人的时候最自在，因为你内心的世界足够丰富。你说话不多但每次都有分量。\n\n提醒：和谐型水人最容易沉溺于深度。井水再清冽也需要被提上来才能解渴。定期把你的思考输出成作品。',D_A:'你不是深井，是深海。表面风平浪静，深处暗流汹涌。你太深了，深到连自己都找不到出口。\n\n具体表现：你花在思考上的时间远远多于行动。“想明白再做”是你最大的咒语——问题是你好像永远都想不明白。你极度需要独处，但独处太久又会陷入精神内耗。\n\n提醒：你不是想不明白，是想太多忘记需要行动来验证。定一个规则：每个想法最多想三天，三天后必须行动，哪怕只是最小的一步。',D_C:'你的深邃天性在和你的另一种能量拔河。你是大海，但体内有火在沸腾，或有土在筑堤。\n\n具体表现：如果是火辅，你刚进入沉思就被行动冲动拉出来——还没想清楚就冲出去，冲完又陷入反思。如果是土辅，你的深度被过于安稳的环境压缩。\n\n提醒：冲突不是病。深水遇火焰会产生蒸汽——巨大的能量。你不需要选边站，可以交替进行：冲一阵，沉一下，再冲。',D_T:'你正在从深海的观察者变成海面的导航者。你的深邃还在，但不再只为自己探索。\n\n具体表现：你越来越愿意把私人的思考和感悟分享出来。过去你觉得“我自己懂就够了”，现在你体会到“分享才能让思想活着”。你学会在需要的深度待够就走。\n\n提醒：水转化后的方向是流动——从池塘流向河流，从河流流向大海。深度如果只为自己服务就是死水。分享你的深刻，你才会变成活水。'};
var patternDesc={O_B:'你是木火通明型。你的创造力和行动力形成了良性循环。想到就去做，做了又有新灵感。你有天生的感染力和推动力，别人跟着你的节奏会感到兴奋。注意：你可能会太快推进，偶尔放慢脚步让团队跟上。',O_A:'你是木土相成型。你的生长力有稳厚的土壤作为支撑。你既能创新又能坚持。你不是最耀眼的那个人，但你是事情能做成的那个人。注意：稳定有时会压制冒险精神，偶尔允许自己失控一次。',O_R:'你是木金型。你的创造力需要经过结构的打磨才能发光。你是一个天生的产品经理。总能做出既有创意又实用的东西。注意：金会限制木的自由度，给自己留一些不被评判的创作时间。',O_D:'你是木水相生型。水滋养木，你的深度反思是创造力的源泉。你思考得越深，灵感就越多。注意：你可能陷入思考的闭环而忘记行动。把你的思考定期输出，让思想流动起来。',B_O:'你是火木型。火借木势，你的行动力有源源不断的燃料。你是一个天生的开拓者，总能在别人犹豫的时候迈出第一步。注意：偶尔放慢节奏，等一等身边的人。',B_A:'你是火土型。你的热情有稳重的容器。你能点燃气氛也能收拾残局。你是团队里那种既有冲劲又靠谱的人。注意：土克火，稳定有时会压抑你的本能冲动。留意那些“算了吧”的瞬间。',B_R:'你是火金型。行动和逻辑在你体内并存。你能做出果断的决策同时保持理性。你是一个既有激情又有策略的人。注意：当你想“有道理但是”的时候，试试先做再说。',B_D:'你是水火型。热情与深度在你体内并存。你既能冲锋陷阵又能深度反思。你是那种在聚会中活跃但在独处时安静的人。注意：你可能会在冲动和反思间反复横跳。建立节奏，冲一阵沉一下。',A_O:'你是土木型。你的稳定包容了生长的需求。你是团队的根基也是创新的温床。你让身边的人感到安心。注意：你可能会为了和谐而放弃自己的需求。',A_B:'你是土火型。大地与火焰的结合。你有沉稳的底气和行动的勇气。你不是那种冒进的人，但关键时刻从不退缩。注意：当你的激情被“理智”说服时，听听你的直觉。',A_R:'你是土金型。结构和稳定是你的核心力量。你擅长把混乱变成有序。你是天生的运营者和执行者。提醒：偶尔允许自己做个不守规矩的人——柔软也是一种力量。',A_D:'你是土水型。稳定与深度的结合。你表面平静但内心丰富。你是那种让人有倾诉欲望的人。注意：你可能用“没事”来回避自己的情绪。',R_O:'你是金木型。结构与创造力在你体内共存。你是一个有系统思维的创新者。你的创意不是凭空而来的，是有逻辑支撑的。注意：先创造，再评判。',R_B:'你是金火型。规则与行动力的结合。你能制定计划也能执行。你是那种说到做到的人。注意：过度思考可能会让你错过行动的最佳时机。',R_A:'你是金土型。结构与稳定的双重力量。你是系统思维者也是可靠的后盾。你能在混乱中搭建框架。注意：偶尔接受“不完美但可行”的方案。',R_D:'你是金水型。逻辑与深度的结合。你追求底层原理而非表面答案。你能看透事物的本质。提醒：偶尔尝试从感性的角度出发，会让你的世界更完整。',D_O:'你是水木型。深度与创造力的结合。你的所有灵感都来自深入的思考。你是一个有思想深度的创作者。注意：你的深度需要外界的输入来保持新鲜。',D_B:'你是水火型。深度与行动力的结合。你既能深思熟虑又能果断行动。先观察，后发力。注意：设一个“想够了”的闹钟。',D_A:'你是水土型。深度与稳定的结合。你是一个有内涵的可靠者。你的平静来自深处对自己的了解。注意：定期打破你的日常节奏。',D_R:'你是水金型。深度与逻辑的结合。你的思考能力和分析能力都很强。你是天生的研究者和策略家。提醒：偶尔回到现实中来，和外界产生一些连接，你的内心世界会更丰富。'};
function growthAdvice(pr,st){var adv={O_H:'你是一棵枝叶舒展的树，养分充足，空间刚好。\n\n成长空间：你的平衡让你稳定持久，偶尔主动打破舒适区会带来新的突破契机。\n\n具体行动：1. 选一个你最想提升的维度，连续30天只练这一个。2. 主动找一个和你能量结构相反的人做搭档。3. 每月做一件让自己觉得“不太像我”的事。4. 把“我也不知道”改成“我选择不做”——明确拒绝比模糊赞同更有力量。',O_A:'你是一片雨林，雨水太多反而让土壤流失了。\n\n核心瓶颈：你想得太多做得太多却没有一条清晰的输出主线。你的生命力变成了发散而不是聚焦。\n\n具体行动：1. 每周五筛选下周的三个创意，其余存档不问。2. 每个新想法附上“如果我不做这个，最坏结果是什么”。3. 找一个“金”型朋友做决策过滤器。4. 每天关掉手机2小时只做一件事。5. 把创意用一页纸写清楚——写不清楚就别做了。',O_C:'你的创造力正在和一个强有力的内部对手摔跤。不是对手太强，是你没有分清楚战场。\n\n核心瓶颈：两个系统争抢同一块资源导致死机。你的任务不是分高下，是为它们划定各自的领地。\n\n具体行动：1. 早上先做“创造力时间”（自由书写30分钟），不评断不修改。2. 再做“结构时间”（整理规划排序），两者不相混。3. 冲突时把两个声音各写一句话然后折中。4. 创造时不批评，批评时不创造。5. 每月回顾产出质量，倾斜资源。',O_T:'一棵树正在经历换叶的季节。你不是枯萎了，你是准备换一种活法。\n\n核心瓶颈：你还在用旧的身份理解自己。“我是某某类型的人”这句话正在限制你。\n\n具体行动：1. 列出三件“过去喜欢但现在不想做”的事——认真告别。2. 列出三个“过去觉得不可能但现在想试试”的方向——勇敢探索。3. 找一个完成过类似转化的人聊天。4. 给新方向一个“试用期”——三个月不承诺不回头。5. 转化期不设太多目标，只设一个方向。方向比速度重要。',B_H:'一团温和明亮的篝火，能照亮整个营地。\n\n成长空间：在照顾他人的同时，也可以先照顾自己的行动力。温和与坚定并不矛盾。\n\n具体行动：1. 每周做一件“可能冒犯到别人但正确”的事。2. 找一个需要对抗的场景——辩论、谈判——检验战斗意志。3. 别总当“调节气氛”的那个人，偶尔让气氛冷着。4. 记录一周内为不伤害别人而没有说的话，挑一件说出来。',B_A:'你是一座活火山。不是火山有问题，是你需要在火山口装一个发电机。\n\n核心瓶颈：能量输出不稳定，全凭情绪。真正的力量不是爆发力，是持续稳定的输出。\n\n具体行动：1. 每天固定时间做固定的事——用纪律驯服能量。2. 把冲动变成“定时炸弹”——设定行动日期，到了就做。3. 找更有结构的人合作——互相补足，形成合力。4. 用运动消耗多余能量而不是争吵。5. 每天忍三次冲动的瞬间，记下来。',B_C:'你的火在逆风中燃烧。风越大火越旺——前提是你找对方向。\n\n核心瓶颈：你的内在对抗消耗了热情。不是动力不足，是动力用错了方向。\n\n具体行动：1. 如果是水辅：每冲动一次写300字反思——用深度引导而不是压制造型。2. 如果是金辅：每次行动前列三个最简单步骤就出发。3. 找一个安全领域全力释放（运动/创作）。4. 接受你天生就是矛盾的，这不是bug是feature。5. 设一个“行动日”和一个“思考日”，严格分开。',B_T:'你正从火焰变成光和热。形式变了，能量没有变。\n\n核心瓶颈：你误以为“安静了”就是“没火了”。你容易自我怀疑——“我还是那个有冲劲的人吗？”\n\n具体行动：1. 用产出和影响来衡量自己而不是外在表现。2. 每周记录一件你“安静地推动了”的事。3. 别急着告诉别人你的转变——让他们自己发现。4. 练习“有选择的热情”——不是每件事都值得你燃烧。5. 沮丧时去做体力活——火只是换了形态。',A_H:'一片肥沃的土地，四季常青。问题是——你种了什么？\n\n核心瓶颈：你在“维护状态”上花的时间超过了“种植”。你一直在保持，没有在创造。\n\n具体行动：1. 在安全区内挖一个小缺口——换条路上班，尝试新的社交方式。2. 每月引进一个新习惯。3. 练习说“不”——包容力应服务于你的选择而非别人的便利。4. 让身边最不安分的朋友带你折腾一次。5. 问自己：如果现状永不改变，你能接受吗？',A_A:'你是最可靠的基石——稳定坚韧，值得信赖。你的坚持让身边的人都感到安心。坚固不是问题，问题是混凝土里什么都没有。\n\n成长空间：稳定有时会变成惯性。偶尔给生活留一些变化的缝隙，新的可能性就会进来。\n\n具体行动：1. 每月做一件“不靠谱”的事——没有计划没有预期没有后路。2. 日程表空出20%不填。3. 学一个和你的专业完全无关的技能。4. 每周和三个不同圈子的人吃饭。5. 试“99%法则”——做完就是100分。6. 把最喜欢的一句话改成“够好了”。',A_C:'大地在下沉，还是海洋在上涌？\n\n核心瓶颈：稳定与你的另一种本能在对抗。你不是有问题，是体内正在进行地质活动。\n\n具体行动：1. 土被水克（辅为水）：每周有一天“不管理情绪”。2. 土克水（辅为水）：打开一个情绪出口——写日记、找朋友深谈。3. 土被金克（辅为金）：设定一个“不列计划日”。4. 土克金（辅为金）：主动建立一套系统。5. 每晚花5分钟问：今天的哪个行为是“习惯”，哪个是“选择”？',A_T:'你正从地基变成花园。从“承载”变成“孕育”。\n\n核心瓶颈：你习惯了做支持者，不习惯做发起者。你的安全感建立在“不出错”之上，但成长需要“出错”。\n\n具体行动：1. 主动发起一件事，不等待邀请。2. 在团队里说一次“我来负责”。3. 告诉一个朋友你真实的弱点。4. 用你的稳定作为跳板而不是沙发。5. 接受：转化中的人看起来会不稳定，那是暂时的。',R_H:'一座精密的机器，运转丝滑。但机器需要被使用，不只是被维护。\n\n核心瓶颈：你的结构能力让你成为优秀的系统维护者，但你可能忘了问——这个系统值得维护吗？\n\n具体行动：1. 每周花一小时拷问核心假设——“这件事真的是这样吗？”2. 做一个和逻辑无关的决定。3. 把一个信守多年的“原则”主动打破一次。4. 学习一门艺术的思维方式。5. 帮团队里最不靠谱的人一次忙。',R_A:'你的思维精密而深入，擅长把复杂问题拆解为清晰的逻辑链。\n\n成长空间：智慧是做中学——先行动再完善，边做边迭代。\n\n具体行动：1. 每天做一个“50/50决定”——30秒内必须选。2. 把重要决定交给运气（抛硬币），观察自己的反应。3. 每周和一个“凭感觉”的人工作一次。4. 写一个“不完美版本”——第一个版本只要存在。5. 不要优化还没开始的事情。',R_C:'精密和自由的战争。你的大脑里有两个人，他们需要轮班而不是对决。\n\n核心瓶颈：你在该行动时分析，在该分析时后悔。模式切换出了问题。\n\n具体行动：1. 两顶帽子——“艺术家帽”（创造不评判），“编辑帽”（评判不创造）。2. 金克木（辅为木）：先写三句“这挺好”再写三句“可更好”。3. 金被木克（辅为木）：计划加20%弹性时间。4. 冲突不可怕，可怕的是你用完美主义枪毙了自己的创造力。',R_T:'从分析师到架构师的路上，最大的敌人是完美的标准。\n\n核心瓶颈：你习惯把每件事做“对”，但转型期没有“对”的答案，只有“好”的方向。\n\n具体行动：1. 先搭一个可工作的最小系统再优化。2. 写“设计日志”——记录为什么做这个决定。3. 找使用者而不是评审者来评价你的工作。4. 量化“完美版本”和“现在版本”的差距，接受80分的现在。5. 好的系统是长出来的，不是设计出来的。',D_H:'一口有恒温的井——水很满很静，但没人来打水。\n\n成长空间：偶尔主动输出，让更多人看到你的深度价值。\n\n具体行动：1. 建立固定输出机制——每周写文章录播客或画图。2. 不要等“想透了”再表达，把思考过程也当作内容。3. 找一个“浅一点”的朋友定期聊天。4. 学会在不同深度之间游动。5. 把反思写成300字以内的短文——迫使你提炼而不是沉迷。',D_A:'你的反思能力很强，能在事物表面之下看到更深的层次。\n\n成长空间：深度思考是为行动服务的。在理解的基础上向前迈一步，才是真正的成长。\n\n具体行动：1. 设“思考截止时间”——每个问题最多想48小时。2. 开始做事，不求做对只求开始。3. 找行动力强的人做“行动教练”。4. 每天做一件不需要思考的事。5. 把深度理解为蓄能而不是目的地——水只有流动才不会腐。6. 日记用“接下来做什么”结尾。',D_C:'深水与火焰的缠绵。你不会变成一个单一的人，但需要学习协调。\n\n核心瓶颈：在“深度”和“行动”间反复横跳，每次都觉得自己选错了。其实是缺乏时间分配策略。\n\n具体行动：1. 水被火克（辅为火）：每次行动前给自己15分钟“沉淀时间”。2. 水被土克（辅为土）：给自己制造不适感。3. 水克火（辅为火）：定一个“够了”的标准，不再用想太多当借口。4. 每周回顾能量波动曲线，匹配时间窗口。5. 把冲突变成作品而不是内耗。',D_T:'从深海观察者到海面航行者的转变，最需要放下“完美的理解”。\n\n核心瓶颈：你习惯了完全理解才行动，但转化期没有说明书。你必须在不知道全貌时迈步。\n\n具体行动：1. 实验“不完全理解就行动”——选一件小事不研究直接做。2. 把深度分享给别人——分享的过程就在加深理解。3. 建立“先做后想”机制：行动10分钟反思5分钟再行动10分钟。4. 接受一个悖论：你只有通过行动才能理解你本应理解的。5. 找一个比你浅但比你快乐的人。'};return adv[pr+'_'+st]||'你的组合是独特的。最好的成长方向是反直觉的——去做你自认为不擅长的事。';}

for(var di=0;di<9;di++){var dp=dimMath(pr,sc,ks,ds,di);h+='<div class="dc" style="background:'+dp.c+'20"><div class="dlb"><span class="dn" style="color:'+dp.c+'">'+dp.n+'</span><span>'+dp.v+'</span></div><div class="dtr"><div class="df" style="width:'+dp.p+'%;background:'+dp.c+'"></div></div></div>';}
h+='</div></div>';
h+='<div class="res-section"><h2><span class="h2-icon" style="background:'+E[pr].clr+'">D</span>成长建议</h2><p>'+growthAdvice(pr,st)+'</p></div>';
h+='<div class="res-section"><h2><span class="h2-icon" style="background:'+E[pr].clr+'">E</span>匹配类型</h2><p>'+patternDesc[pr+'_'+sc]+'</p></div>';
h+='<div class="res-section"><h2><span class="h2-icon" style="background:'+E[pr].clr+'">F</span>生克转化</h2>'+transformBox(pr,p)+'</div>';
h+='<div class="res-section"><h2><span class="h2-icon" style="background:'+E[pr].clr+'">G</span>你可能认识</h2><div class="fg">';
var famArr=FAMOUS[pr]||[];var shown=[];var copy=famArr.slice(),seen={};
while(shown.length<7&&copy.length>0){var ri=Math.floor(Math.random()*copy.length);var item=copy.splice(ri,1)[0];if(!item)break;if(seen[item.n])continue;seen[item.n]=true;shown.push(item);}
var emos={O:'🌱',B:'🔥',A:'⛰',R:'💎',D:'💧'};
for(var i=0;i<shown.length;i++){h+='<div class="fc"><div class="fa" style="background:'+E[pr].clr+'">'+emos[pr]+'</div><div class="fn">'+shown[i].n+'<div class="ft">'+shown[i].t+' · '+shown[i].d+'</div></div></div>';}
h+='</div></div></div>';
h+='<button class="rb" onclick="showRes()">重新测试</button></div>';
document.getElementById('res').innerHTML=h;
window.scrollTo(0,0);}


function dimMath(pr,sc,ks,ds,di){
var map=[{k:pr,i:0},{k:pr,i:1},{k:pr,i:2},{k:sc,i:0},{k:sc,i:1},{k:sc,i:2},{k:ks[2],i:0},{k:ks[3],i:0},{k:ks[4],i:0}];
var m=map[di]||{k:pr,i:0};var el=E[m.k]||E[pr];var d=el.d3[m.i]||el.d3[0];
var v=ds[m.k+'_'+m.i]||50;var nm=d.n;var ec=el.clr;
return {n:nm, v:v, p:Math.min(v,100), c:ec};}

var SKDESCS=[{t:'生',txt:'木生火：木是燃料，火是燃烧，燃料越多火越旺。在人生中，创造力（木）需要通过行动（火）来释放，光有想法不去做，木就堆积腐烂了。'},{t:'生',txt:'火生土：火燃烧后留下灰烬，灰烬变成土壤。在人生中，你的行动力和热情（火）最终会为你建立稳定的根基（土）。每件全力以赴的事都在为你筑地基。'},{t:'生',txt:'土生金：土孕育矿石，矿石提炼为金属。在人生中，你的包容和稳定（土）是提炼清晰规则和结构（金）的前提。厚德方能载物。'},{t:'生',txt:'金生水：金属遇冷凝结水珠，结构通向本质。在人生中，当你把一件事理清了结构（金），深度思考（水）就自然发生了。条理不是深度的敌人，是深度的通道。'},{t:'生',txt:'水生木：水滋润树木，根深才能叶茂。在人生中，深度反思和沉淀（水）是创造力和好奇心（木）的源泉。越了解自己，生长动力就越不可阻挡。'},{t:'克',txt:'木克土：树根在土壤中生长时会撑裂岩石。在人生中，过强的创造力（木）会破坏稳定（土）。不是不要生长，是要有选择地生长。'},{t:'克',txt:'土克水：河岸用土壤筑堤，约束水流的方向。在人生中，过分的稳定和包容（土）会压制深度探索（水）的空间。安全感太足时你可能会忘记潜水寻宝。'},{t:'克',txt:'水克火：水能灭火，这不是水火不容，是调节。在人生中，深度反思（水）会克制冲动和热情（火）。三思而行避免了莽撞，但也可能让你失去冲出去的勇气。'},{t:'克',txt:'火克金：烈火可以熔化金属，热情可以融化规则。在人生中，行动力（火）会打破僵化的结构（金）。规矩是死的，你是活的。'},{t:'克',txt:'金克木：斧头可以砍断树木，结构可以限制创造力。在人生中，过强的规则感和逻辑（金）会抑制生长的本能（木）。计划太完美反而扼杀了可能性。'}];
function transformBox(pr,p){var h='';for(var i=0;i<SKDESCS.length;i++){h+='<div class="tb-row"><div class="tb-tag '+(SKDESCS[i].t=='生'?'ok':'ko')+'">'+SKDESCS[i].t+'</div><div class="tb-body">'+SKDESCS[i].txt+'</div></div>';}return h;}
</script>
