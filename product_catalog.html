<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>晴川轮胎 · 朝阳1号在线报价</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#333;padding-bottom:80px}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:24px 16px 18px;text-align:center}
.header h1{font-size:22px;font-weight:700;letter-spacing:1px}
.header p{font-size:13px;color:#888;margin-top:6px}
.header .shop-name{color:#e8b830;font-size:14px;margin-top:4px}
.filter-bar{display:flex;gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid #eee;overflow-x:auto;white-space:nowrap}
.filter-bar::-webkit-scrollbar{display:none}
.filter-btn{display:inline-block;padding:6px 16px;border-radius:20px;font-size:13px;border:1px solid #ddd;background:#fff;color:#666;cursor:pointer;transition:.2s;flex-shrink:0}
.filter-btn.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.2s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-1px)}
.card-img{width:100%;aspect-ratio:1;background:#f8f8f8;display:flex;align-items:center;justify-content:center;padding:16px}
.card-img svg{width:80%;height:auto}
.card-body{padding:10px 12px 12px}
.card-spec{font-size:14px;font-weight:600;color:#1a1a2e}
.card-app{font-size:11px;color:#999;margin-top:2px}
.card-price{color:#c0392b;font-size:18px;font-weight:700;margin-top:6px}
.card-price span{font-size:12px;font-weight:400;color:#999}
.card-badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;margin-top:4px}
.badge-ev{background:#e3f2fd;color:#1565c0}
.badge-suv{background:#fff3e0;color:#e65100}
.badge-sedan{background:#e8f5e9;color:#2e7d32}
.badge-lux{background:#f3e5f5;color:#7b1fa2}
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px;box-shadow:0 -2px 12px rgba(0,0,0,.08);text-align:center}
.footer p{font-size:12px;color:#999;line-height:1.6}
.footer .phone{color:#1a1a2e;font-size:14px;font-weight:600}
.footer .phone a{color:#1a1a2e;text-decoration:none}
</style>
</head>
<body>

<div class="header">
  <h1>🔧 晴川轮胎·在线报价</h1>
  <p>朝阳1号 · 批发价 · 实体店拿货</p>
  <div class="shop-name">📍 湖北孝感 · 晴川轮胎（朝阳轮胎授权经销商）</div>
</div>

<div class="filter-bar" id="filterBar">
  <span class="filter-btn active" data-filter="all">全部</span>
  <span class="filter-btn" data-filter="suv">SUV</span>
  <span class="filter-btn" data-filter="sedan">轿车</span>
  <span class="filter-btn" data-filter="ev">新能源</span>
  <span class="filter-btn" data-filter="luxury">豪华</span>
  <span class="filter-btn" data-filter="budget">经济型</span>
</div>

<div class="grid" id="productGrid"></div>

<div class="footer">
  <p>📞 <span class="phone"><a href="tel:13871981176">13871981176</a></span></p>
  <p>孝感市 · 实体店现货 · 支持配送</p>
</div>

<script>
const products = [
  {spec:"205/55R16",price:499,app:"大众朗逸/丰田卡罗拉/日产轩逸",tag:"budget",label:"经济型"},
  {spec:"195/65R15",price:479,app:"大众速腾/斯柯达明锐",tag:"budget",label:"经济型"},
  {spec:"215/55R16",price:529,app:"大众宝来/丰田卡罗拉",tag:"sedan",label:"轿车"},
  {spec:"205/55R17 XL",price:569,app:"福克斯/马自达3",tag:"sedan",label:"轿车"},
  {spec:"215/55R17",price:649,app:"丰田凯美瑞/大众迈腾",tag:"sedan",label:"轿车"},
  {spec:"225/55R17",price:689,app:"宝马3系/奥迪A4L/凯美瑞",tag:"sedan",label:"轿车"},
  {spec:"225/50R17",price:679,app:"奥迪A4L/大众帕萨特",tag:"sedan",label:"轿车"},
  {spec:"215/55R18",price:729,app:"丰田凯美瑞/亚洲龙/本田雅阁",tag:"sedan",label:"轿车"},
  {spec:"225/55R18",price:889,app:"奥迪A6L/奔驰E级/宝马5系",tag:"luxury",label:"豪华轿车"},
  {spec:"225/45R18",price:839,app:"宝马3系/奥迪A4L",tag:"luxury",label:"豪华轿车"},
  {spec:"245/45R18 XL",price:869,app:"宝马5系/奥迪A6L",tag:"luxury",label:"豪华轿车"},
  {spec:"235/55R18",price:859,app:"大众途观/奥迪Q5",tag:"suv",label:"中型SUV"},
  {spec:"225/65R17",price:659,app:"本田CR-V/丰田RAV4",tag:"suv",label:"紧凑型SUV"},
  {spec:"235/65R17",price:799,app:"哈弗H6/长安CS75/荣威RX5",tag:"suv",label:"紧凑型SUV"},
  {spec:"245/65R17",price:869,app:"哈弗H6/长安CS75",tag:"suv",label:"紧凑型SUV"},
  {spec:"235/55R19 XL",price:939,app:"奔驰GLC/宝马X3",tag:"suv",label:"豪华SUV"},
  {spec:"255/55R19",price:959,app:"宝马X3/理想L7",tag:"ev",label:"新能源SUV"},
  {spec:"255/50R19",price:999,app:"宝马X5/奔驰GLE",tag:"luxury",label:"豪华SUV"},
  {spec:"255/50R20",price:1259,app:"理想L9/问界M9/宝马X5",tag:"ev",label:"豪华SUV"},
  {spec:"245/45R20",price:1199,app:"比亚迪汉EV/特斯拉Model Y/理想L8",tag:"ev",label:"新能源"},
];

function getTireSVG(spec, index) {
  const colors = ["#e74c3c","#2c3e50","#1a5276","#7d6608","#1b4332","#6c3483","#a93226","#273746"];
  const c = colors[index % colors.length];
  const size = spec.match(/^(\d+)\/(\d+)/);
  const aspect = size ? 95 + (parseInt(size[2])/200)*30 : 100;
  return `<svg viewBox="0 0 200 200">
    <defs>
      <linearGradient id="tread${index}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#2c3e50"/>
        <stop offset="100%" style="stop-color:#1a1a2e"/>
      </linearGradient>
      <linearGradient id="ring${index}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#ecf0f1"/>
        <stop offset="100%" style="stop-color:#bdc3c7"/>
      </linearGradient>
    </defs>
    <circle cx="100" cy="100" r="92" fill="none" stroke="url(#tread${index})" stroke-width="14"/>
    <circle cx="100" cy="100" r="85" fill="none" stroke="#34495e" stroke-width="2"/>
    <circle cx="100" cy="100" r="78" fill="url(#ring${index})" stroke="#95a5a6" stroke-width="1"/>
    <circle cx="100" cy="100" r="48" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
    <circle cx="100" cy="100" r="30" fill="#ecf0f1"/>
    <text x="100" y="98" text-anchor="middle" font-size="10" fill="#7f8c8d" font-weight="bold">CHAOYANG</text>
    <text x="100" y="113" text-anchor="middle" font-size="7" fill="#95a5a6">朝阳轮胎</text>
    ${[0,45,90,135,180,225,270,315].map((a,i) =>
      `<line x1="${100+63*Math.cos((a-90)*Math.PI/180)}" y1="${100+63*Math.sin((a-90)*Math.PI/180)}" x2="${100+77*Math.cos((a-90)*Math.PI/180)}" y2="${100+77*Math.sin((a-90)*Math.PI/180)}" stroke="#2c3e50" stroke-width="3"/>`
    ).join('')}
    ${[22.5,67.5,112.5,157.5,202.5,247.5,292.5,337.5].map((a,i) =>
      `<line x1="${100+63*Math.cos((a-90)*Math.PI/180)}" y1="${100+63*Math.sin((a-90)*Math.PI/180)}" x2="${100+77*Math.cos((a-90)*Math.PI/180)}" y2="${100+77*Math.sin((a-90)*Math.PI/180)}" stroke="#34495e" stroke-width="2"/>`
    ).join('')}
  </svg>`;
}

const filters = document.querySelectorAll('.filter-btn');
const grid = document.getElementById('productGrid');

function render(filter){
  const filtered = filter==='all' ? products : products.filter(p=>p.tag===filter);
  grid.innerHTML = filtered.map((p,i)=>{
    const badges = {
      budget:'经济型', sedan:'轿车', suv:'SUV', ev:'新能源', luxury:'豪华'
    };
    const badgeClass = {budget:'badge budget',sedan:'badge sedan',suv:'badge suv',ev:'badge ev',luxury:'badge lux'};
    return `<div class="card">
      <div class="card-img">${getTireSVG(p.spec,i)}</div>
      <div class="card-body">
        <div class="card-spec">${p.spec}</div>
        <div class="card-app">适配：${p.app}</div>
        <div class="card-price">¥${p.price} <span>/条</span></div>
        <span class="card-badge ${badgeClass[p.tag]}">${badges[p.tag]}</span>
      </div>
    </div>`;
  }).join('');
}

filters.forEach(btn=>{
  btn.addEventListener('click',()=>{
    filters.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
});

render('all');
</script>
</body>
</html>
