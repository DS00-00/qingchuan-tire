const filters = document.querySelectorAll('.filter-btn');
const grid = document.getElementById('productGrid');

function render(filter){
  const filtered = filter==='all' ? products : products.filter(p=>p.tag===filter);
  grid.innerHTML = filtered.map((p,i)=>{
    const badges = {
      budget:'经济型', sedan:'轿车', suv:'SUV', ev:'新能源', luxury:'豪华'
    };
    const badgeClass = {budget:'badge budget',sedan:'badge sedan',suv:'badge suv',ev:'badge ev',luxury:'badge lux'};
    return `<div class="card">
      <div class="card-img">${getTireImg(i)}</div>
      <div class="card-body">
        <div class="card-spec">${p.spec}</div>
        <div class="card-app">适配：${p.app}</div>
        <div class="card-price">¥${p.price} <span>/条</span></div>
        <span class="card-badge ${badgeClass[p.tag]}">${badges[p.tag]}</span>
      </div>
    </div>`;
  }).join('');
}

filters.forEach(btn=>{
  btn.addEventListener('click',()=>{
    filters.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
});

render('all');
</script>
