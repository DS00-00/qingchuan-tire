<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=750,initial-scale=0.5,maximum-scale=1.0">
<title>晴川轮胎 · 车型匹配报价</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;width:750px;margin:0 auto}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:32px 24px 20px;color:#fff}
.header h1{font-size:26px;font-weight:700;letter-spacing:1px}
.header p{font-size:13px;opacity:.6;margin-top:4px}
.topbar{position:sticky;top:0;z-index:10;background:#f5f5f5;padding:12px 24px 0}
.search-wrap{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;padding:0 14px;height:48px}
.search-wrap .icon{font-size:18px;color:#aaa;margin-right:8px}
.search-wrap input{flex:1;height:48px;font-size:16px;border:none;outline:none;background:0 0}
.search-wrap .clear{font-size:20px;color:#ccc;cursor:pointer;padding:6px;display:none}
.search-wrap .clear.show{display:block}
.stats-wrap{font-size:13px;color:#999;padding:8px 24px 4px}
.content{padding:0 24px 100px}
.section{background:#fff;border-radius:10px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden}
.section-header{
  background:#1a1a2e;color:#fff;padding:10px 14px;font-size:14px;font-weight:600;
  display:flex;justify-content:space-between;align-items:center
}
.section-header .badge{font-size:11px;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:8px}
.row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 14px;border-bottom:1px solid #f3f3f3;font-size:14px;min-height:38px
}
.row:last-child{border-bottom:none}
.row .size{font-weight:500;color:#333}
.row .price{font-weight:700;color:#c62828}
.row .price.none{color:#bbb;font-weight:400;font-size:12px}
.row:nth-child(even){background:#fafafa}
.no-results{text-align:center;padding:60px 0;color:#bbb}
.no-results .big{font-size:46px;margin-bottom:10px}
.no-results p{font-size:15px}
.footer{position:fixed;bottom:0;width:750px;background:#fff;padding:8px 24px;border-top:1px solid #eee;font-size:12px;color:#999;display:flex;justify-content:space-between}
</style>
</head>
<body>

<div class="header">
  <h1>🔍 车型 · 规格 · 报价</h1>
  <p>晴川轮胎 · 朝阳轮胎孝感经销商</p>
</div>

<div class="topbar">
  <div class="search-wrap">
    <span class="icon">🔎</span>
    <input id="search" type="text" placeholder="输入车型，如 本田CRV、卡罗拉…" autocomplete="off">
    <span class="clear" id="clearBtn" onclick="cls()">✕</span>
  </div>
</div>
<div class="stats-wrap" id="stats"></div>
<div class="content" id="content"></div>
<div class="footer"><span>晴川轮胎 · 孝感</span><span>报价仅供参考 以店内为准</span></div>

<script>
async function init(){
  const r=await fetch('./data/full_quote_data.json');
  const D=await r.json();
  const all=D.all, idx=D.idx, hot=D.hot;
  const inp=document.getElementById('search'), c=document.getElementById('content'), s=document.getElementById('stats');
  showHot(hot);
  
  let timer;
  inp.addEventListener('input',function(){
    document.getElementById('clearBtn').classList.toggle('show',this.value.length>0);
    clearTimeout(timer);
    const v=this.value.trim();
    if(!v){showHot(hot);return;}
    timer=setTimeout(()=>search(v),100);
  });
  
  function showHot(hotList){
    s.textContent='孝感常见车型 Top 20';
    let h='';
    hotList.forEach(car=>{
      if(!all[car])return;
      const specs=all[car];
      h+='<div class="section"><div class="section-header"><span>'+car+'</span><span class="badge">'+specs.length+'种</span></div>';
      specs.forEach(sp=>{
        const pr=sp[1]>0?'¥'+sp[1]:'<span style="color:#bbb">询价</span>';
        h+='<div class="row"><span class="size">'+sp[0]+'</span><span class="price'+(sp[1]>0?'':' none')+'">'+pr+'</span></div>';
      });
      h+='</div>';
    });
    c.innerHTML=h;
  }
  
  function search(q){
    const uc=q.toUpperCase().replace(/[·\-()（）\s]/g,'');
    if(!uc)return;
    
    const found=new Set();
    if(idx[uc])found.add(idx[uc]);
    for(let k in idx){if(found.size>=15)break;if(k.includes(uc)||uc.includes(k))found.add(idx[k]);}
    for(let car in all){if(found.size>=15)break;if(car.toUpperCase().replace(/[·\-()（）\s]/g,'').includes(uc))found.add(car);}
    
    const arr=Array.from(found).filter(c=>all[c]);
    s.textContent=arr.length?arr.length+' 个匹配结果':'';
    
    if(!arr.length){
      c.innerHTML='<div class="no-results"><div class="big">🔍</div><p>未找到「'+q+'」</p></div>';
      return;
    }
    
    let h='';
    arr.forEach(car=>{
      const specs=all[car];
      h+='<div class="section"><div class="section-header"><span>'+car+'</span><span class="badge">'+specs.length+'种</span></div>';
      specs.forEach(sp=>{
        const pr=sp[1]>0?'¥'+sp[1]:'<span style="color:#bbb">询价</span>';
        h+='<div class="row"><span class="size">'+sp[0]+'</span><span class="price'+(sp[1]>0?'':' none')+'">'+pr+'</span></div>';
      });
      h+='</div>';
    });
    c.innerHTML=h;
  }
  
  window.cls=function(){
    inp.value='';document.getElementById('clearBtn').classList.remove('show');showHot(hot);inp.focus();
  };
}
init();
</script>
</body>
</html>
