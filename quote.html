* { margin: 0; padding: 0; box-sizing: border-box; }
body {

  background: #f2f0ed; color: #1a1a1a; min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #b00020, #d42030);
  color: #fff; padding: 28px 16px 20px; text-align: center;
}
.header h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
.header .sub { font-size: 13px; opacity: .8; margin-top: 4px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 12px; }
.search-box {
  position: sticky; top: 0; z-index: 10;
  background: #f2f0ed; padding: 10px 0 8px;
}
.search-box input {
  width: 100%; padding: 12px 14px; border: 1px solid #ddd;
  border-radius: 10px; font-size: 15px; background: #fff;
  outline: none; transition: border .2s;
}
.search-box input:focus { border-color: #b00020; }
.tabs {
  display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
  background: #fff; border: 1px solid #ddd; font-size: 13px;
  cursor: pointer; transition: all .2s; white-space: nowrap;
}
.tab:hover { border-color: #999; }
.tab.active { background: #b00020; color: #fff; border-color: #b00020; }
.stats {
  font-size: 12px; color: #888; padding: 2px 4px 8px;
}
table {
  width: 100%; border-collapse: separate; border-spacing: 0 4px;
}
th {
  position: sticky; top: 56px; z-index: 5;
  background: #f2f0ed; padding: 6px 10px; 
  font-size: 12px; color: #888; font-weight: 500;
  text-align: left; white-space: nowrap;
}
th:nth-child(3) { text-align: right; }
td {
  background: #fff; padding: 10px 12px; font-size: 14px;
}
td:first-child { border-radius: 8px 0 0 8px; }
td:last-child { border-radius: 0 8px 8px 0; }
td:nth-child(2) { font-weight: 600; }
td:nth-child(3) { text-align: right; font-weight: 700; color: #b00020; }
td .pt { 
  display: inline-block; font-size: 11px; color: #666;
  background: #f5f3f0; padding: 1px 8px; border-radius: 10px;
  margin-right: 6px;
}
tr.hide { display: none; }
.empty { text-align: center; padding: 40px 0; color: #999; font-size: 14px; }
.footer {
  text-align: center; padding: 20px; font-size: 11px; color: #aaa;
}

  EVPRO: "EVPRO (新能源)",
  "朝阳1号": "朝阳1号 (轿车)",
  SUV: "SUV",
  ZRT: "ZRT (性能)",
  "A/T": "A/T (越野)"
};

const KEYS = Object.keys(DATA);
let current = "朝阳1号";
let allData = [];

KEYS.forEach(k => {
  DATA[k].forEach(d => allData.push({ pattern: k, spec: d[0], price: d[1] }));
});

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const tbody = document.getElementById("list");
  const empty = document.getElementById("empty");
  let items = allData.filter(d => d.pattern === current);
  if (q) items = items.filter(d => d.spec.toLowerCase().includes(q));
  tbody.innerHTML = items.map(d => 
    `<tr><td><span class="pt">${LABELS[current]}</span>${d.spec}</td><td></td><td>¥${d.price}</td></tr>`
  ).join("");
  empty.style.display = items.length ? "none" : "block";
  document.getElementById("stats").textContent = `共 ${items.length} 条规格`;
  renderTabs();
}

function renderTabs() {
  const container = document.getElementById("tabs");
  container.innerHTML = KEYS.map(k =>
    `<div class="tab${k === current ? ' active' : ''}" onclick="switchTab('${k}')">${LABELS[k]}</div>`
  ).join("");
}

function switchTab(k) { current = k; render(); }

document.getElementById("search").addEventListener("input", render);
render();
