let allData = [];



KEYS.forEach(k => {

  DATA[k].forEach(d => allData.push({pattern:k, spec:d[0], price:d[1]}));

});



// ===== 渲染 =====

function renderProfile() {

  const p = PROFILES[current];

  if (!p) { document.getElementById("profile-area").innerHTML=""; return; }

  const tags = p.tags.map(t => `<span class="p-tag ${t[1]}">${t[0]}</span>`).join("");

  const specs = p.specs.map(s => `<div class="fb"><strong>${s[1]}</strong>${s[0]}<br><small>${s[2]}</small></div>`).join("");

  const tech = p.tech.map(t => `<li>${t}</li>`).join("");

  document.getElementById("profile-area").innerHTML = `

    <div class="profile">

      <div class="p-title">${p.title} ${tags}</div>

      <div class="p-desc">${p.desc}</div>

      <div class="feature-bar">${specs}</div>

      <ul class="p-bullet">${tech}</ul>

      <div style="margin-top:6px;font-size:12px;color:#666;">📏 实际里程：${p.life} &nbsp;|&nbsp; 🚗 适配：${p.fit}</div>

    </div>`;

}



function render() {

  const q = document.getElementById("search").value.trim().toLowerCase();

  const tbody = document.getElementById("list");

  const empty = document.getElementById("empty");

  let items = allData.filter(d => d.pattern === current);

  if (q) items = items.filter(d => d.spec.toLowerCase().includes(q));

  tbody.innerHTML = items.map(d =>

    `<tr><td><div class="spec">${d.spec}</div>${CAR_MODELS[d.spec]?'<div class="car-model">'+CAR_MODELS[d.spec]+'</div>':''}</td><td>${CAR_MODELS[d.spec]?'':''}</td><td>¥${d.price}</td></tr>`

  ).join("");

  empty.style.display = items.length ? "none" : "block";

  document.getElementById("stats").textContent = `共 ${items.length} 条规格`;

  renderProfile();

  renderTabs();

}



function renderTabs() {

  const container = document.getElementById("tabs");

  container.innerHTML = KEYS.map(k =>

    `<div class="tab${k===current?' active':''}" onclick="switchTab('${k}')">${LABELS[k]||k}</div>`

  ).join("");

}



function switchTab(k) { current=k; render(); }



document.getElementById("search").addEventListener("input", render);

renderTabs();

render();
